<!DOCTYPE html>
<html lang="ml"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SBL AI Academy</title>
<style>
:root{--bg:#f2f5ff;--card:#fff;--text:#0b1b4d;--muted:#566190;--brand:#1b4bff;--on-brand:#fff;--line:#d9e1ff;--ok:#12a150;--wa:#1faa59;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1230;--card:#141f4a;--text:#eef2ff;--muted:#a3b0e0;--brand:#5b86ff;--on-brand:#06102e;--line:#27357a;--ok:#34d27b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1230;--card:#141f4a;--text:#eef2ff;--muted:#a3b0e0;--brand:#5b86ff;--on-brand:#06102e;--line:#27357a;--ok:#34d27b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Malayalam","Segoe UI",Roboto,sans-serif;padding-bottom:96px}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.banner{width:100%;max-width:100%;border-radius:16px;display:block}
h1{font-size:20px;margin:16px 4px 4px}
.sub{color:var(--muted);font-size:14px;margin:0 4px 12px}
.prog{background:var(--line);border-radius:99px;height:10px;overflow:hidden;margin:0 4px}
.prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.pt{font-size:13px;color:var(--muted);margin:6px 4px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card.done{border-color:var(--ok)}
.top{display:flex;gap:12px;align-items:flex-start}
.n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700}
.card.done .n{background:var(--ok)}
.t{font-weight:700;font-size:16px}
.d{font-size:13.5px;color:var(--muted);margin-top:3px}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1 1 140px;border:0;border-radius:10px;padding:11px 12px;font:inherit;font-weight:600;font-size:14px;text-align:center;text-decoration:none;cursor:pointer}
.play{background:var(--brand);color:var(--on-brand)}
.mark{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.card.done .mark{background:var(--ok);border-color:var(--ok);color:#fff}
.btn[disabled],.off{opacity:.5;pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.wa{display:block;max-width:536px;margin:0 auto;background:var(--wa);color:#fff;text-decoration:none;text-align:center;font-weight:700;padding:14px;border-radius:12px}
</style></head><body>
