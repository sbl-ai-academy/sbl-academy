<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#14182b;--muted:#5d6580;--accent:#5b3df5;--accent2:#e8e4ff;--line:#e2e5f0;--ok:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c30;--text:#eef0fa;--muted:#9aa2c4;--accent:#8b78ff;--accent2:#262a4a;--line:#2a2f4d;--ok:#4ade80}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c30;--text:#eef0fa;--muted:#9aa2c4;--accent:#8b78ff;--accent2:#262a4a;--line:#2a2f4d;--ok:#4ade80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px}
header{background:var(--accent);color:#fff;border-radius:18px;padding:20px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#fff;flex:none;place-items:center;font-weight:800;color:var(--accent)}
header h1{margin:0;font-size:22px}
header p{margin:4px 0 0;opacity:.9;font-size:14px}
.bar{height:8px;background:rgba(255,255,255,.3);border-radius:8px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;width:0;transition:width .3s}
.pt{font-size:13px;margin-top:6px}
h2{font-size:16px;margin:22px 0 10px}
.lesson{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;color:var(--text);font:inherit}
.num{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent2);color:var(--accent);display:grid;place-items:center;font-weight:700}
.lesson.done .num{background:var(--ok);color:#fff}
.lesson b{display:block;font-size:15px}
.lesson small{color:var(--muted)}
#player{display:none}
.vid{position:relative;aspect-ratio:9/16;max-height:70vh;margin:0 auto;background:#000;border-radius:14px;overflow:hidden}
.vid a.tp{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center}
.vid a.tp span{width:72px;height:72px;border-radius:50%;background:rgba(255,0,0,.9);color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;padding-left:6px}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;min-width:140px;text-align:center;padding:13px;border-radius:12px;border:0;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.p{background:var(--accent);color:#fff}
.s{background:var(--accent2);color:var(--accent)}
.note{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
</style>
</head>
