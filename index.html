<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI പഠനം · Learn AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;800&family=Sora:wght@500;700&display=swap">
<style>
:root{--bg:#f0f3f8;--ink:#13203b;--mute:#4d5b78;--card:#fff;--line:#d5dcea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10172a;--ink:#eef2fb;--mute:#aab6d0;--card:#1a2340;--line:#2d3a5f}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Malayalam","Sora",system-ui,sans-serif;line-height:1.65}
main{max-width:960px;margin:0 auto;padding:28px 18px 56px}
h1,h2{font-family:"Sora","Noto Sans Malayalam",sans-serif;line-height:1.2;margin:0}
.hero h1{font-size:clamp(2rem,6vw,3.4rem)}
.video{margin:22px 0 30px;max-width:760px}
.frame{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--line)}
.frame iframe,.frame video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.video a{display:inline-block;margin-top:8px;color:var(--mute);font-size:.9rem}
.frame a.play{position:absolute;inset:0;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:16px;color:#fff;text-decoration:none;font-size:1.05rem;background:linear-gradient(135deg,#1f3fb0,#13203b)}
.frame a.play:hover{background:linear-gradient(135deg,#2a52d8,#1b2b52)}
.frame a.play:focus-visible{outline:3px solid #fff;outline-offset:-6px}
.play svg{width:68px;height:68px}
.play b{font-family:"Sora",sans-serif;font-size:1.3rem}
.seen{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:12px;padding:14px;border:2px solid #f2b01e;border-radius:12px;background:#f2b01e;color:#201600;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;transition:background .2s,color .2s}
.seen:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.s .seen{background:#1f9d55;border-color:#1f9d55;color:#fff}
.tick{display:none;font-style:normal;background:#fff;color:#1f7a45;border-radius:999px;padding:0 9px;font-size:.9rem;margin-left:4px}
.s .tick{display:inline-block}
.mod{display:block;font-style:normal;font-size:.8rem;font-weight:700;opacity:.9;margin-bottom:4px}
.modno{display:inline-block;background:var(--c);color:var(--t);border-radius:999px;padding:2px 14px;font-weight:700;font-size:.85rem;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.btn{display:block;text-decoration:none;color:var(--t);background:var(--c);border-radius:14px;padding:20px 20px 18px;min-height:112px;transition:transform .15s,background .15s}
.btn{box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)}
.btn:hover{transform:translateY(-3px);filter:brightness(1.12)}
.btn:focus-visible,.nav a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn b{display:block;font-family:"Sora",sans-serif;font-size:1.15rem}
.btn span{display:block;margin-top:6px;font-size:1.05rem;opacity:.95}
.page{display:none}.page.on{display:block}
.back{display:inline-block;margin-bottom:22px;color:var(--ink);font-weight:600;text-decoration:none;border:2px solid var(--line);border-radius:999px;padding:6px 16px}
.back:hover{border-color:var(--ink)}
.topic h2{font-size:clamp(1.8rem,5vw,2.8rem)}
.topic .ml{font-size:clamp(1.4rem,4vw,2rem);font-weight:800;color:var(--ink);margin-top:4px}
.cols{display:grid;grid-template-columns:1fr;gap:18px;margin-top:26px;max-width:760px}
.col{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:12px;padding:20px}
.col h3{margin:0 0 8px;font-size:.95rem;color:var(--mute);font-weight:600}
.col ul{margin:12px 0 0;padding-left:20px}
.col li{margin-bottom:8px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:30px;flex-wrap:wrap}
.nav a{color:var(--ink);font-weight:600;text-decoration:none;border:2px solid var(--line);border-radius:999px;padding:8px 18px}
.nav a:hover{border-color:var(--ink)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<main>
<section class="page on" id="home">
 <div class="hero">
  <h1>AI പഠിക്കാം<br>Learn AI</h1>
  <div class="video"><div class="frame"><iframe src="https://www.youtube-nocookie.com/embed/In2ekCHtNMM?rel=0&modestbranding=1&playsinline=1&enablejsapi=1" title="Introduction video" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div></div>
 </div>
 <div class="grid" id="grid"></div>
</section>
<div id="topics"></div>
</main>
<script>
var T=[
["intro","Introduction to AI","AI ആമുഖം",
"AI is technology that lets computers learn from data and do tasks that normally need human thinking.",
"കമ്പ്യൂട്ടറുകൾക്ക് ഡാറ്റയിൽ നിന്ന് പഠിച്ച്, സാധാരണയായി മനുഷ്യബുദ്ധി വേണ്ട ജോലികൾ ചെയ്യാൻ സഹായിക്കുന്ന സാങ്കേതികവിദ്യയാണ് നിർമിതബുദ്ധി (AI).",
[["Machine learning finds patterns in data","മെഷീൻ ലേണിംഗ് ഡാറ്റയിലെ പാറ്റേണുകൾ കണ്ടെത്തുന്നു"],["Used in search, maps and recommendations","സെർച്ച്, മാപ്പ്, ശുപാർശകൾ എന്നിവയിൽ ഉപയോഗിക്കുന്നു"],["Helpful, but people must stay in charge","ഉപകാരപ്രദം, പക്ഷേ നിയന്ത്രണം മനുഷ്യരുടെ കൈയിൽ വേണം"]]],
["generative","Generative AI","ജനറേറ്റീവ് AI",
"Generative AI creates new text, images, audio and video from a prompt.",
"ഒരു നിർദേശത്തിൽ നിന്ന് പുതിയ ടെക്സ്റ്റ്, ചിത്രം, ശബ്ദം, വീഡിയോ എന്നിവ സൃഷ്ടിക്കുന്ന AI ആണ് ജനറേറ്റീവ് AI.",
[["Trained on very large datasets","വളരെ വലിയ ഡാറ്റാസെറ്റുകളിൽ പരിശീലിപ്പിക്കുന്നു"],["Large language models write and reason in text","ലാർജ് ലാംഗ്വേജ് മോഡലുകൾ ടെക്സ്റ്റ് എഴുതുകയും വിശകലനം ചെയ്യുകയും ചെയ്യുന്നു"],["Always check the output for mistakes","ഫലത്തിൽ തെറ്റുണ്ടോ എന്ന് എപ്പോഴും പരിശോധിക്കുക"]]],
["chatbots","AI Chatbots & Assistants","AI ചാറ്റ്ബോട്ടുകളും അസിസ്റ്റന്റുകളും",
"Chatbots talk with you to answer questions and finish tasks.",
"ചോദ്യങ്ങൾക്ക് ഉത്തരം നൽകാനും ജോലികൾ പൂർത്തിയാക്കാനും സംഭാഷണത്തിലൂടെ സഹായിക്കുന്നവയാണ് ചാറ്റ്ബോട്ടുകൾ.",
[["Answer questions, summarise, translate","ഉത്തരം നൽകൽ, സംഗ്രഹിക്കൽ, പരിഭാഷ"],["Customer support at any hour","ഏത് സമയത്തും ഉപഭോക്തൃ സേവനം"],["Voice assistants work the same way, by speech","വോയ്സ് അസിസ്റ്റന്റുകൾ ശബ്ദത്തിലൂടെ ഇതേ രീതിയിൽ പ്രവർത്തിക്കുന്നു"]]],
["prompts","AI Prompt Engineering","AI പ്രോംപ്റ്റ് എഞ്ചിനീയറിംഗ്",
"Prompt engineering is writing clear instructions so AI gives better answers.",
"AIയിൽ നിന്ന് മികച്ച ഉത്തരം ലഭിക്കാൻ വ്യക്തമായ നിർദേശങ്ങൾ എഴുതുന്ന വിദ്യയാണ് പ്രോംപ്റ്റ് എഞ്ചിനീയറിംഗ്.",
[["Give context and a clear goal","സന്ദർഭവും വ്യക്തമായ ലക്ഷ്യവും നൽകുക"],["Say the format and length you want","വേണ്ട ഫോർമാറ്റും നീളവും പറയുക"],["Improve the result with follow-up prompts","തുടർ നിർദേശങ്ങളിലൂടെ ഫലം മെച്ചപ്പെടുത്തുക"]]],
["images","AI Image Creation","AI ചിത്ര നിർമാണം",
"AI turns a written description into a new image.",
"എഴുതിയ വിവരണത്തിൽ നിന്ന് AI പുതിയ ചിത്രങ്ങൾ നിർമിക്കുന്നു.",
[["Describe the subject, style and lighting","വിഷയം, ശൈലി, വെളിച്ചം എന്നിവ വിവരിക്കുക"],["Used for posters, social posts and concept art","പോസ്റ്ററുകൾ, സോഷ്യൽ പോസ്റ്റുകൾ, കൺസെപ്റ്റ് ആർട്ട് എന്നിവയ്ക്ക് ഉപയോഗിക്കുന്നു"],["Respect copyright; don’t pass off fake images as real","പകർപ്പവകാശം മാനിക്കുക; വ്യാജ ചിത്രങ്ങൾ യഥാർഥമെന്ന് പറഞ്ഞ് പ്രചരിപ്പിക്കരുത്"]]],
["video","AI Video Creation","AI വീഡിയോ നിർമാണം",
"AI can generate or edit video clips from text, images or footage.",
"ടെക്സ്റ്റ്, ചിത്രം, ഫൂട്ടേജ് എന്നിവയിൽ നിന്ന് AI വീഡിയോ ക്ലിപ്പുകൾ നിർമിക്കുകയോ എഡിറ്റ് ചെയ്യുകയോ ചെയ്യുന്നു.",
[["Plan it as script, scenes, then clips","സ്ക്രിപ്റ്റ്, രംഗങ്ങൾ, ക്ലിപ്പുകൾ എന്ന ക്രമത്തിൽ ആസൂത്രണം ചെയ്യുക"],["Automatic captions and translation","ഓട്ടോമാറ്റിക് ക്യാപ്ഷനും പരിഭാഷയും"],["Say clearly when a video is AI-made","വീഡിയോ AI നിർമിതമാണെങ്കിൽ അത് വ്യക്തമായി അറിയിക്കുക"]]],
["audio","AI Audio & Voice Generation","AI ഓഡിയോ & വോയ്സ് ജനറേഷൻ",
"AI can create speech, music and sound from text.",
"ടെക്സ്റ്റിൽ നിന്ന് സംസാരം, സംഗീതം, ശബ്ദം എന്നിവ സൃഷ്ടിക്കാൻ AIക്ക് കഴിയും.",
[["Text-to-speech for narration","വിവരണത്തിന് ടെക്സ്റ്റ്-ടു-സ്പീച്ച്"],["Speech-to-text for transcripts","ട്രാൻസ്ക്രിപ്റ്റിന് സ്പീച്ച്-ടു-ടെക്സ്റ്റ്"],["Get consent before cloning anyone’s voice","ആരുടെയെങ്കിലും ശബ്ദം പകർത്തുംമുമ്പ് സമ്മതം വാങ്ങുക"]]],
["business","AI for Business & Marketing","ബിസിനസ്സിനും മാർക്കറ്റിംഗിനും AI",
"AI saves time on content, customer insight and campaigns.",
"ഉള്ളടക്കം, ഉപഭോക്തൃ വിശകലനം, ക്യാമ്പെയ്‌നുകൾ എന്നിവയിൽ AI സമയം ലാഭിക്കുന്നു.",
[["Draft emails, ads and product descriptions","ഇമെയിൽ, പരസ്യം, ഉൽപ്പന്ന വിവരണം എന്നിവ തയ്യാറാക്കൽ"],["Analyse customer feedback and trends","ഉപഭോക്തൃ അഭിപ്രായങ്ങളും ട്രെൻഡുകളും വിശകലനം ചെയ്യൽ"],["Keep customer data private","ഉപഭോക്തൃ ഡാറ്റ സ്വകാര്യമായി സൂക്ഷിക്കുക"]]]
];
var grid=document.getElementById("grid"),box=document.getElementById("topics");
function href(id){return id==="video"?"video.html":"#"+id}
function extra(id){
 if(id!=="intro")return "";
 return '<div class="video"><div class="frame"><iframe id="ytIntro" src="https://www.youtube-nocookie.com/embed/enuIMO7oHbU?rel=0&modestbranding=1&playsinline=1&enablejsapi=1" title="Introduction to AI" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div><button type="button" class="seen" id="seen" aria-pressed="false"></button></div>';
}
T.forEach(function(t,i){
 var P=[["#0b2f80","#fff"],["#1a7f1f","#fff"]][i%2];
 grid.insertAdjacentHTML("beforeend",'<a class="btn" style="--c:'+P[0]+';--t:'+P[1]+'" href="'+href(t[0])+'"><em class="mod">Module '+(i+1)+'</em><b>'+t[1]+(t[0]==="intro"?' <i class="tick">✓</i>':'')+'</b><span>'+t[2]+'</span></a>');
 var p=T[i-1],n=T[i+1];
 var li=function(k){return t[5].map(function(x){return "<li>"+x[k]+"</li>"}).join("")};
 box.insertAdjacentHTML("beforeend",
 '<section class="page topic" id="'+t[0]+'" style="--c:'+P[0]+';--t:'+P[1]+'"><a class="back" href="#home">← Home</a>'+
 '<div class="modno">Module '+(i+1)+'</div><h2>'+t[1]+'</h2><div class="ml">'+t[2]+'</div>'+extra(t[0])+'<div class="cols">'+
 '<div class="col"><h3>മലയാളം</h3><p>'+t[4]+'</p><ul>'+li(1)+'</ul></div>'+
 '<div class="col"><h3>English</h3><p>'+t[3]+'</p><ul>'+li(0)+'</ul></div></div>'+
 '<div class="nav"><span>'+(p?'<a href="'+href(p[0])+'">← '+p[1]+'</a>':'')+'</span><span>'+(n?'<a href="'+href(n[0])+'">'+n[1]+' →</a>':'')+'</span></div></section>');
});
var seenBox=document.getElementById("seen");
function mark(v){document.body.classList.toggle("s",v);if(seenBox){seenBox.setAttribute("aria-pressed",String(v));seenBox.textContent=v?"✓ Watched":"Tap when you have watched"}}
var v0=false;try{v0=localStorage.getItem("seen-intro")==="1"}catch(e){}
mark(v0);
if(seenBox)seenBox.addEventListener("click",function(){var n=!document.body.classList.contains("s");mark(n);try{localStorage.setItem("seen-intro",n?"1":"0")}catch(e){}});
function save(n){try{localStorage.setItem("seen-intro",n?"1":"0")}catch(e){}}
window.onYouTubeIframeAPIReady=function(){
 if(!document.getElementById("ytIntro"))return;
 new YT.Player("ytIntro",{events:{onStateChange:function(e){if(e.data===0){mark(true);save(true)}}}});
};
var ytTag=document.createElement("script");ytTag.src="https://www.youtube.com/iframe_api";document.head.appendChild(ytTag);
function show(){
 var id=(location.hash||"#home").slice(1);
 var el=document.getElementById(id)||document.getElementById("home");
 document.querySelectorAll("iframe").forEach(function(f){try{f.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}',"*")}catch(e){}});
 document.querySelectorAll(".page").forEach(function(s){s.classList.remove("on")});
 el.classList.add("on");
 document.title=(el.id==="home"?"AI പഠനം · Learn AI":el.querySelector("h2").textContent+" · AI പഠനം");
 window.scrollTo(0,0);
}
window.addEventListener("hashchange",show);show();
</script>
</body>
</html>
